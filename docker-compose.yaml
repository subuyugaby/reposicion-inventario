# Airflow 3 (LocalExecutor + Postgres) y un servidor de MLflow.
# El repositorio se monta en /opt/reposicion/proyecto (fuera de /opt/airflow) y la bandeja en solo lectura.

x-airflow-common: &airflow-common
  build: .
  image: reposicion-airflow:3.3.2
  user: "${AIRFLOW_UID:-50000}:0"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: 4
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: reposicion-inventario-local
    PYTHONPATH: /opt/reposicion/proyecto/src
    REPOSICION_RAIZ: /opt/reposicion/proyecto
    REPOSICION_BANDEJA: /opt/reposicion/bandeja
    MLFLOW_TRACKING_URI: http://mlflow:5000
    MLFLOW_DISABLE_AGENT_HINT: "1"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - .:/opt/reposicion/proyecto
    - ./bandeja:/opt/reposicion/bandeja:ro
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy
    mlflow:
      condition: service_started

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.2
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artefactos --serve-artifacts
      --allowed-hosts "mlflow:5000,localhost:5001"
    ports:
      - "5001:5000"
    volumes:
      - ./mlflow:/mlflow

  airflow-init:
    <<: *airflow-common
    command: ["bash", "-c", "airflow db migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 10s
      retries: 10
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db:
